<style>
/* Direction: composed, exact, bilingual. A black-and-white studio print: graphite and paper neutrals, one desert-ochre ink used rarely.
   Moments: the portrait scene, the real deliverables as framed slides, the 7D route. Signature: every title paired with its other-language twin.
   Layout: dark portrait scene, then quiet paper sections on a 4px grid; the page closes in the same dark world. */
:root{
  --bg:#F6F5F2; --surface:#FDFCFA; --raised:#EEECE7; --line:#E3E1DB; --line-2:#D2CFC7;
  --fg:#1C1A17; --fg-2:#56524B; --fg-3:#716C63;
  --accent:#9A5A14; --ok:#2F7A4E;
  --scene:#161616; --scene-fg:#EEEDEA; --scene-fg-2:#ABA8A2; --scene-fg-3:#8C8983; --scene-line:rgba(255,255,255,.11); --scene-accent:#D9A05B;
  --sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --head:64px; --maxw:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#191918; --raised:#222120; --line:#2A2927; --line-2:#3A3835;
  --fg:#EDEBE7; --fg-2:#ABA79F; --fg-3:#8F8B83; --accent:#D9A05B; --ok:#5DBF8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#191918; --raised:#222120; --line:#2A2927; --line-2:#3A3835;
  --fg:#EDEBE7; --fg-2:#ABA79F; --fg-3:#8F8B83; --accent:#D9A05B; --ok:#5DBF8A; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--head) + env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
:root[lang="ar"] body{font-size:1.0625rem;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
:root.at-scene body::before{background:var(--scene)}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4,p,figure,dl,dd{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:500;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.scene :focus-visible{outline-color:var(--scene-accent)}
.num{font-variant-numeric:tabular-nums}
.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:root[dir="rtl"] .icon-dir{transform:scaleX(-1)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
@media (min-width:768px){.wrap{padding-left:max(40px, env(safe-area-inset-left,0px));padding-right:max(40px, env(safe-area-inset-right,0px))}}
.scene{background:var(--scene);color:var(--scene-fg)}
.alt{font-size:1rem;font-weight:400;letter-spacing:0;color:var(--fg-3)}
.scene .alt{color:var(--scene-fg-3)}
.lbl{font-size:.8125rem;color:var(--fg-3);margin-block-end:8px}

/* Header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
:root.at-scene .site-head{background:var(--scene);border-bottom-color:var(--scene-line);color:var(--scene-fg)}
.head-row{display:flex;align-items:center;gap:16px;height:var(--head)}
.brand{padding-block:10px;font-weight:500;font-size:.9375rem;text-decoration:none;white-space:nowrap}
:root.boot .site-head,:root.boot .site-head *{transition:none}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{position:relative;text-decoration:none;font-size:.875rem;color:var(--fg-2);padding:8px 12px;border-radius:8px;transition:color .15s var(--ease),background-color .15s var(--ease)}
.nav a:hover{color:var(--fg);background:var(--raised)}
:root.at-scene .nav a{color:var(--scene-fg-2)}
:root.at-scene .nav a:hover{color:var(--scene-fg);background:rgba(255,255,255,.06)}
.nav a[aria-current="true"]{color:var(--fg)}
:root.at-scene .nav a[aria-current="true"]{color:var(--scene-fg)}
.nav a[aria-current="true"]::after{content:"";position:absolute;inset-inline:12px;bottom:2px;height:2px;border-radius:1px;background:var(--accent)}
:root.at-scene .nav a[aria-current="true"]::after{background:var(--scene-accent)}
.head-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font-size:.875rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.head-btn:hover{background:var(--raised)}
:root.at-scene .head-btn{border-color:var(--scene-line)}
:root.at-scene .head-btn:hover{background:rgba(255,255,255,.06)}
.lang-btn[lang="ar"]{font-family:"IBM Plex Sans Arabic",var(--sans)}
.menu-btn{display:none}
.menu-panel{position:absolute;inset-inline:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px 16px;animation:rise .18s var(--ease)}
:root.at-scene .menu-panel{background:var(--scene);border-bottom-color:var(--scene-line)}
.menu-panel nav{display:grid}
.menu-panel a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:1rem;border-bottom:1px solid var(--line)}
:root.at-scene .menu-panel a{border-bottom-color:var(--scene-line)}
.menu-panel a:last-child{border-bottom:0}
.menu-panel a[aria-current="true"]{color:var(--accent)}
:root.at-scene .menu-panel a[aria-current="true"]{color:var(--scene-accent)}
@media (max-width:960px){.nav{display:none}.lang-btn{margin-inline-start:auto}.menu-btn{display:inline-flex}}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Hero scene */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero-inner{position:relative;padding-block:96px 64px}
.hero-text{max-width:600px;display:grid;gap:24px}
.who{display:grid;gap:4px}
.who-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:1rem;font-weight:500}
.who-role{font-size:.9375rem;color:var(--scene-fg-2)}
.hero h1{font-size:clamp(2.5rem,4.8vw,4.125rem);line-height:1.04;letter-spacing:-.03em}
:root[lang="ar"] .hero h1{font-size:clamp(2.125rem,4vw,3.375rem);line-height:1.35;letter-spacing:0}
.hero .lede{font-size:1.1875rem;line-height:1.55;color:var(--scene-fg-2);max-width:36rem}
:root[lang="ar"] .hero .lede{font-size:1.125rem;line-height:1.8}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-block-start:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:8px;font-weight:500;font-size:.9375rem;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--scene-fg);color:var(--scene)}
.btn-primary:hover{background:#FFFFFF}
.btn-quiet{border-color:var(--scene-line);color:var(--scene-fg)}
.btn-quiet:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22)}
.hero-photo{position:absolute;inset-block:0;inset-inline-end:0;width:min(56%,860px);z-index:-1}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hero-photo::before,.hero-photo::after{content:"";position:absolute;inset:0;pointer-events:none}
.hero-photo::before{background:linear-gradient(to right,var(--scene) 0%,rgba(22,22,22,0) 42%)}
:root[dir="rtl"] .hero-photo::before{background:linear-gradient(to left,var(--scene) 0%,rgba(22,22,22,0) 42%)}
.hero-photo::after{background:linear-gradient(to top,var(--scene) 0%,rgba(22,22,22,0) 32%)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--scene-line)}
.fact{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:4px;padding-block:24px 32px;padding-inline-end:24px}
.fact + .fact{padding-inline-start:24px;border-inline-start:1px solid var(--scene-line)}
.fact dt{font-size:.875rem;line-height:1.45;color:var(--scene-fg-2)}
.fact dd{font-size:1.75rem;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
@media (max-width:960px){
  .hero-inner{padding-block:64px 32px}
  .hero-photo{position:relative;inset:auto;width:100%;aspect-ratio:4/3;max-height:560px;z-index:0}
  .hero-photo::before,:root[dir="rtl"] .hero-photo::before{background:linear-gradient(to bottom,var(--scene) 0%,rgba(22,22,22,0) 24%)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fact:nth-child(3){border-inline-start:0;padding-inline-start:0}
  .fact:nth-child(n+3){border-top:1px solid var(--scene-line)}
}
@media (max-width:560px){.hero h1{font-size:2.375rem}:root[lang="ar"] .hero h1{font-size:2rem}}

/* Sections */
.section{padding-block:clamp(64px,8vw,96px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 48px;align-items:end;padding-block-end:24px;border-bottom:1px solid var(--line-2);margin-block-end:48px}
.sec-head h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:clamp(1.75rem,3vw,2.5rem);line-height:1.15;letter-spacing:-.02em}
:root[lang="ar"] .sec-head h2{letter-spacing:0;line-height:1.4}
.sec-head p{color:var(--fg-2);max-width:52ch}
@media (max-width:768px){.sec-head{grid-template-columns:1fr;margin-block-end:32px}}

/* Case studies */
.case{padding-block:64px;border-top:1px solid var(--line)}
.case:first-child{padding-block-start:0;border-top:0}
.case-head{display:grid;gap:12px;max-width:760px;margin-block-end:32px}
.kicker{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.875rem;color:var(--fg-2)}
.kicker .yr{font-family:var(--mono);color:var(--fg-3)}
.case-head h3{font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.2;letter-spacing:-.015em}
:root[lang="ar"] .case-head h3{letter-spacing:0;line-height:1.45}
.case-lede{font-size:1.125rem;line-height:1.55;color:var(--fg-2)}
:root[lang="ar"] .case-lede{line-height:1.8}
.case-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start}
@media (max-width:960px){.case-grid{grid-template-columns:1fr;gap:32px}}
.frame{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--raised)}
.frame img{width:100%;height:100%;object-fit:cover;transition:opacity .2s var(--ease)}
.frame.contain img{object-fit:contain}
.g-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 16px;margin-block-start:12px}
.cap{flex:1 1 220px;min-width:0;font-size:.8125rem;line-height:1.45;color:var(--fg-3)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:80px;aspect-ratio:16/9;padding:0;border-radius:6px;overflow:hidden;border:1px solid var(--line-2);background:var(--raised);cursor:pointer;opacity:.55;transition:opacity .15s var(--ease),border-color .15s var(--ease)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb:hover{opacity:.85}
.thumb[aria-pressed="true"]{opacity:1;border-color:var(--fg)}
.case-side{display:grid;gap:24px;min-width:0}
.summary{display:grid;gap:24px;min-width:0}
.challenge{max-width:60ch}
.idea{padding-block-start:24px;border-top:1px solid var(--line)}
.quote{font-size:clamp(1.25rem,1.9vw,1.5rem);line-height:1.3;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
:root[lang="ar"] .quote{line-height:1.6;letter-spacing:0}
.idea-text{margin-block-start:8px;font-size:.9375rem;color:var(--fg-2)}
.meta{border-top:1px solid var(--line)}
.meta div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding-block:12px;border-bottom:1px solid var(--line)}
.meta dt{font-size:.8125rem;color:var(--fg-3);padding-block-start:2px}
.meta dd{font-size:.9375rem}
.outputs ul{display:grid;gap:4px}
.outputs li{display:flex;gap:12px;font-size:.9375rem;line-height:1.55}
.outputs li::before{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:var(--fg-3);margin-block-start:.7em}
.case-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.more-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:.875rem;font-weight:500;cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease),transform .12s var(--ease)}
.more-btn:hover{border-color:var(--fg-3)}
.more-btn:active{transform:scale(.98)}
.more-btn .icon{transition:transform .2s var(--ease)}
.more-btn[aria-expanded="true"] .icon{transform:rotate(180deg)}
.text-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:.875rem;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;transition:color .15s var(--ease),text-decoration-color .15s var(--ease)}
.text-link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px 48px;margin-block-start:32px;padding:32px;border-radius:12px;background:var(--surface);border:1px solid var(--line);animation:rise .24s var(--ease)}
.detail h4{grid-column:1/-1;font-size:.8125rem;font-weight:500;color:var(--fg-3)}
.detail .steps{max-width:72ch}
.detail .note{margin-block-start:16px;font-size:.8125rem;color:var(--fg-3)}
.steps{display:grid;gap:12px;counter-reset:step}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;counter-increment:step}
.steps li::before{content:counter(step);font-family:var(--mono);font-size:.8125rem;color:var(--fg-3);padding-block-start:2px}
@media (max-width:768px){.detail{grid-template-columns:1fr;padding:24px}}

/* More engagements */
.more{margin-block-start:64px}
.more-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-block-end:8px}
.more-head h3{font-size:1.5rem;line-height:1.25}
.more-sub{color:var(--fg-2);margin-block-end:24px}
.more-list{border-top:1px solid var(--line-2)}
.more-item{display:grid;grid-template-columns:96px minmax(0,4fr) minmax(0,7fr);gap:8px 32px;padding-block:24px;border-bottom:1px solid var(--line)}
.more-item .yr{font-family:var(--mono);font-size:.8125rem;color:var(--fg-3);padding-block-start:4px}
.more-item h4{font-size:1.125rem;line-height:1.35}
.more-item .d{font-size:.875rem;color:var(--fg-2);margin-block-start:4px}
.more-item .sec{font-size:.8125rem;color:var(--fg-3)}
.more-item .t{display:grid;gap:8px;font-size:.9375rem;color:var(--fg-2)}
.more-item .q{color:var(--fg);font-weight:500}
@media (max-width:768px){.more-item{grid-template-columns:1fr}}

/* Range */
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.matrix{border-collapse:collapse;width:100%;min-width:840px;font-size:.875rem}
.matrix th,.matrix td{height:52px;padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.matrix thead th{height:auto;padding-block:16px 12px;font-size:.8125rem;font-weight:500;line-height:1.35;color:var(--fg-2);vertical-align:bottom}
.matrix th[scope="row"]{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);text-align:start;font-weight:500;white-space:nowrap}
.matrix thead th:first-child{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface)}
.matrix .yr{display:block;font-family:var(--mono);font-size:.75rem;font-weight:400;color:var(--fg-3)}
.matrix tbody tr:last-child > *{border-bottom:0}
.matrix tbody tr:hover > *{background:var(--raised)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.dot.no{width:4px;height:4px;background:var(--line-2)}

/* Method */
.thesis{max-width:30ch;margin-block-end:48px;font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.3;letter-spacing:-.015em}
:root[lang="ar"] .thesis{line-height:1.6;letter-spacing:0}
.route{display:grid;gap:12px;margin-block-end:48px}
.route-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.route-sys span{position:relative;margin-inline:8px;padding-block-end:12px;border-bottom:1px solid var(--line-2);text-align:center;font-size:.8125rem;color:var(--fg-2)}
.route-sys span::before,.route-sys span::after{content:"";position:absolute;bottom:-1px;width:1px;height:8px;background:var(--line-2)}
.route-sys span::before{inset-inline-start:0}
.route-sys span::after{inset-inline-end:0}
.route-line{position:relative;height:16px;align-items:center}
.route-line::before{content:"";position:absolute;top:50%;inset-inline:calc(100% / 14);height:1px;background:var(--fg-3)}
.node{position:relative;z-index:1;justify-self:center;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg);background:var(--bg)}
.node.end{background:var(--accent);border-color:var(--accent)}
.route-ph span{display:grid;gap:2px;padding-inline:4px;text-align:center;font-size:.9375rem;line-height:1.35}
.route-ph b{font-family:var(--mono);font-size:.75rem;font-weight:400;color:var(--fg-3)}
@media (max-width:860px){.route{display:none}}
.systems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.system{display:grid;gap:8px;align-content:start;padding-block-start:20px;border-top:1px solid var(--line-2)}
.system h3{font-size:1.125rem}
.system .ph{font-family:var(--mono);font-size:.75rem;color:var(--fg-3)}
:root[lang="ar"] .system .ph{font-family:var(--sans);font-size:.8125rem}
.system p:last-child{font-size:.9375rem;color:var(--fg-2)}

@media (max-width:560px){.systems{grid-template-columns:1fr}}
.principles{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block-start:48px}
.principles .lbl{margin:0;margin-inline-end:8px}
.chip{padding:4px 10px;border-radius:6px;border:1px solid var(--line-2);font-size:.8125rem;color:var(--fg-2)}
.sources{max-width:80ch;margin-block-start:16px;font-size:.875rem;color:var(--fg-3)}

/* Tools */
.fig{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.fig dt{order:2}
.fig dd{order:1}
.fig:first-child{padding-block-start:0}
.fig:last-child{border-bottom:0}
.fig b{min-width:4.5ch;font-size:clamp(2rem,4vw,3rem);font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.fig span{font-size:.875rem;color:var(--fg-2)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--fg-2)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.status.live::before{background:var(--ok)}
.status.use::before{background:var(--fg)}
.status.pilot::before{background:var(--accent)}
.status.dev::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-3)}
.tool-list{border-top:1px solid var(--line-2)}
.tool-row{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:8px 32px;padding-block:24px;border-bottom:1px solid var(--line)}
.tool-row h4{margin-block-end:8px;font-size:1.0625rem;line-height:1.35}
.tool-row p{font-size:.9375rem;color:var(--fg-2)}
.tool-row .text-link{margin-block-start:4px}
@media (max-width:860px){.tool-row{grid-template-columns:1fr}}
.pcard{display:grid;gap:40px;padding:40px;margin-block-end:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);scroll-margin-top:96px}
.pcard-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px 48px;align-items:end}
.pcard-head h3{margin-block:12px 8px;font-size:clamp(1.375rem,2.2vw,1.75rem);line-height:1.25}
.pcard-aside{max-width:44ch;font-size:.9375rem;color:var(--fg-3)}
.pcard .fw{margin-block-start:0}
.tools-block{padding-block-start:32px;scroll-margin-top:80px}
.tools-block .tool-list{margin-block-start:16px}
.sub-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 48px;align-items:end}
.sub-head h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:clamp(1.25rem,2vw,1.5rem);line-height:1.25;letter-spacing:-.01em}
.sub-head p{max-width:52ch;color:var(--fg-2)}
@media (max-width:860px){.sub-head{grid-template-columns:1fr}}
.pcard-tag{max-width:40ch;font-size:1.0625rem;color:var(--fg-2)}
.ubmp-stage{padding:24px;border-radius:12px;background:var(--raised)}
.ubmp .frame{aspect-ratio:16/10;background:var(--surface);box-shadow:0 1px 2px rgba(28,26,23,.06),0 8px 24px -12px rgba(28,26,23,.18)}
.ubmp .frame img{object-position:50% 0}
.ubmp .thumb{aspect-ratio:16/10;width:72px}
.ubmp-note{margin-block-start:12px;font-size:.8125rem;color:var(--fg-3)}
.ubmp-body{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:32px 48px}
.ubmp-body > p{max-width:58ch;color:var(--fg-2)}
@media (max-width:860px){.pcard{padding:20px;gap:28px}.pcard-head,.ubmp-body{grid-template-columns:1fr}.ubmp-stage{padding:12px}.ubmp .thumbs{flex-wrap:wrap}}
/* Product */
.prod-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.prod-copy{display:grid;gap:24px;min-width:0}
.prod-lede{font-size:clamp(1.375rem,2.2vw,1.75rem);line-height:1.3;font-weight:500;letter-spacing:-.015em;text-wrap:balance}
:root[lang="ar"] .prod-lede{line-height:1.6;letter-spacing:0}
.prod-copy .lbl{margin-block-end:8px}
.prod-copy .steps{font-size:.9375rem}
.screens-panel{padding:32px 32px 24px;border-radius:16px;min-width:0}
.screens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.screens figure:nth-child(even){margin-block-start:32px}
.screens img{border-radius:12px;border:1px solid var(--scene-line)}
.screens figcaption{margin-block-start:8px;text-align:center;font-size:.75rem;color:var(--scene-fg-3)}
.panel-cap{margin-block-start:16px;font-size:.8125rem;color:var(--scene-fg-3)}
.fw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-block-start:48px}
.fw div{display:grid;gap:8px;align-content:start;padding-block-start:16px;border-top:1px solid var(--line-2)}
.fw h3{font-size:1rem}
.fw p{font-size:.9375rem;color:var(--fg-2)}
@media (max-width:960px){.prod-grid{grid-template-columns:1fr}.fw{grid-template-columns:1fr;gap:24px}}
@media (max-width:520px){.screens{grid-template-columns:repeat(2,minmax(0,1fr))}.screens-panel{padding:20px}}

/* Path */
.timeline{max-width:880px;border-top:1px solid var(--line-2)}
.tl{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px 32px;padding-block:24px;border-bottom:1px solid var(--line)}
.tl .yr{padding-block-start:4px;font-family:var(--mono);font-size:.8125rem;color:var(--fg-3);direction:ltr;unicode-bidi:isolate;text-align:start}
:root[dir="rtl"] .tl .yr{text-align:right}
.tl h3{font-size:1.125rem;line-height:1.35}
.tl .org{margin-block:4px 8px;font-size:.9375rem;color:var(--fg-2)}
.tl .d{max-width:62ch;font-size:.9375rem;color:var(--fg-2)}
.sk{display:grid;gap:8px;align-content:start}
.sk p{font-size:.8125rem;color:var(--fg-3)}
.sk ul{display:flex;flex-wrap:wrap;gap:8px}
.sk li{padding:4px 10px;border-radius:6px;border:1px solid var(--line-2);font-size:.8125rem;color:var(--fg-2)}
@media (max-width:560px){.tl{grid-template-columns:1fr}}

/* About */
.about-intro{max-width:44ch;margin-block-end:64px;font-size:clamp(1.25rem,2.1vw,1.625rem);line-height:1.45;letter-spacing:-.01em;text-wrap:pretty}
:root[lang="ar"] .about-intro{line-height:1.8;letter-spacing:0}
.about-block{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px 48px;padding-block:48px;border-top:1px solid var(--line-2)}
.about-block:last-child{padding-block-end:0}
.about-block header h3{font-size:1.25rem;line-height:1.3}
.about-block header p{max-width:32ch;margin-block-start:8px;font-size:.9375rem;color:var(--fg-2)}
.about-body{min-width:0}
.strengths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 40px}
.strength{display:grid;gap:8px;align-content:start}
.strength h4,.row h4,.cert h4{font-size:1.0625rem;line-height:1.35}
.strength p{font-size:.9375rem;color:var(--fg-2)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px 32px;padding-block:16px;border-bottom:1px solid var(--line)}
.row p{font-size:.9375rem;color:var(--fg-2)}
.role-chips{display:flex;flex-wrap:wrap;gap:8px;margin-block-start:12px}
.panel{padding:8px 32px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.panel .rows{border-top:0}
.panel .row:last-child{border-bottom:0}
.certs{border-top:1px solid var(--line)}
.cert{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding-block:16px;border-bottom:1px solid var(--line)}
.cert p{margin-block-start:4px;font-size:.875rem;color:var(--fg-2)}
.cert .yr{flex:none;font-family:var(--mono);font-size:.8125rem;color:var(--fg-3)}
.also{margin-block-start:24px}
.also ul{display:grid;gap:4px}
.also li{font-size:.875rem;color:var(--fg-2)}
.skill-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 40px}
@media (max-width:860px){.about-block{grid-template-columns:1fr;padding-block:40px}.strengths,.skill-groups{grid-template-columns:1fr}.row{grid-template-columns:1fr}.panel{padding:4px 20px}}

/* Contact */
.contact{padding-block:clamp(64px,9vw,112px) 0}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px 64px;align-items:end;padding-block-end:clamp(64px,8vw,96px)}
.contact h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:clamp(2.5rem,5vw,4rem);line-height:1.05;letter-spacing:-.03em}
:root[lang="ar"] .contact h2{line-height:1.35;letter-spacing:0}
.contact .lead{margin-block-start:16px;font-size:1.125rem;color:var(--scene-fg-2)}
.crows{border-top:1px solid var(--scene-line)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding-block:16px;border-bottom:1px solid var(--scene-line)}
.crow .k{grid-column:1/-1;font-size:.8125rem;color:var(--scene-fg-3)}
.crow .v{font-size:1.125rem;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate;text-align:start;user-select:all}
:root[dir="rtl"] .crow .v{text-align:right}
.crow .v.plain{direction:inherit;user-select:text;font-size:1rem;color:var(--scene-fg-2)}
.crow .v.link{direction:inherit;unicode-bidi:normal;user-select:text}
.crow .v a{display:inline-flex;align-items:center;gap:8px;min-height:44px;user-select:text;text-decoration:underline;text-decoration-color:var(--scene-line);text-underline-offset:4px;transition:color .15s var(--ease),text-decoration-color .15s var(--ease)}
.crow .v a:hover{color:var(--scene-accent);text-decoration-color:var(--scene-accent)}
.copy-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--scene-line);background:transparent;font-size:.8125rem;font-weight:500;cursor:pointer;transition:background-color .15s var(--ease)}
.copy-btn:hover{background:rgba(255,255,255,.06)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-block:24px;border-top:1px solid var(--scene-line);font-size:.8125rem;color:var(--scene-fg-3)}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}

/* ---------- v2: pages, tiles, icons, motion ---------- */
[tabindex="-1"]:focus{outline:none}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:580}to{stroke-dashoffset:0}}
@keyframes fillIn{from{fill-opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.8;transform:scale(1.08)}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav a{display:inline-flex;align-items:center;gap:6px}
.nav a .icon{width:15px;height:15px;opacity:.7}
.nav a[aria-current="true"] .icon{opacity:1;color:var(--accent)}
:root.at-scene .nav a[aria-current="true"] .icon{color:var(--scene-accent)}
@media (max-width:1180px){.nav a .icon{display:none}}
.menu-panel a{gap:12px}
.menu-panel a .icon{width:18px;height:18px;color:var(--fg-3)}
.menu-panel a[aria-current="true"] .icon{color:var(--accent)}
:root[data-view="contact"] .contact{min-height:calc(100vh - var(--head))}
/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles li,.ix li{animation:itemIn .55s var(--ease) both;animation-delay:calc(var(--i) * 60ms + 120ms)}
.tile{display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;height:100%;padding:24px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:border-color .2s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{border-color:var(--line-2);transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(28,26,23,.45)}
.tile-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--raised);color:var(--fg);transition:background-color .2s var(--ease),color .2s var(--ease)}
.tile-ic .icon{width:22px;height:22px}
.tile:hover .tile-ic{background:var(--accent);color:var(--surface)}
.tile-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tile-t b{font-size:1.25rem;font-weight:500;letter-spacing:-.01em;line-height:1.25}
.tile-t .alt{font-size:.875rem}
.tile-d{font-size:.9375rem;line-height:1.5;color:var(--fg-2)}
.tile-m{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block-start:12px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--fg-3)}
.tile-m .icon,.ccard-go .icon,.pnav .icon-dir{color:var(--fg);transition:translate .2s var(--ease)}
.tile:hover .tile-m .icon,.ccard:hover .ccard-go .icon,.pnav.next:hover .icon-dir{translate:4px 0}
:root[dir="rtl"] .tile:hover .tile-m .icon,:root[dir="rtl"] .ccard:hover .ccard-go .icon,:root[dir="rtl"] .pnav.next:hover .icon-dir{translate:-4px 0}
.pnav.prev:hover .icon-dir{translate:-4px 0}
:root[dir="rtl"] .pnav.prev:hover .icon-dir{translate:4px 0}
@media (max-width:960px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tiles{grid-template-columns:1fr}.tile{padding:20px}}
/* work index */
.ix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px}
.ccard{display:grid;gap:14px;align-content:start;height:100%;text-decoration:none;color:inherit}
.ccard-img{display:block;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--raised)}
.ccard-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.ccard-img.contain img{object-fit:contain}
.ccard:hover .ccard-img img{transform:scale(1.04)}
.ccard-body{display:grid;gap:6px;min-width:0}
.ccard-t{font-size:1.125rem;font-weight:500;line-height:1.3;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color .2s var(--ease)}
.ccard:hover .ccard-t{text-decoration-color:var(--line-2)}
.ccard-d{font-size:.875rem;line-height:1.5;color:var(--fg-2)}
.ccard-go{display:inline-flex;align-items:center;gap:6px;margin-block-start:2px;font-size:.8125rem;font-weight:500}
@media (max-width:960px){.ix{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.ix{grid-template-columns:1fr}}
/* case page + pager */
.case-page{padding-block-start:clamp(24px,4vw,40px)}
.case-page .case{border-top:0;padding-block:32px 24px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--line)}
.crumbs a{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:.875rem;font-weight:500;text-decoration:none;color:var(--fg-2);transition:color .15s var(--ease)}
.crumbs a:hover{color:var(--fg)}
.crumbs .pos{font-family:var(--mono);font-size:.8125rem;color:var(--fg-3)}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-block:8px clamp(56px,8vw,96px)}
.pnav{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:16px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:border-color .2s var(--ease),transform .25s var(--ease)}
.pnav:hover{border-color:var(--line-2);transform:translateY(-2px)}
.pnav.next{grid-column:2;grid-template-columns:minmax(0,1fr) auto;text-align:end}
.pnav-txt{display:grid;gap:2px;min-width:0}
.pnav-lbl{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--fg-3)}
.pnav.next .pnav-lbl{justify-content:flex-end}
.pnav b{font-size:1.0625rem;font-weight:500;line-height:1.3}
.pnav-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--raised);color:var(--fg-2)}
.pnav-ic .icon{width:20px;height:20px}
.pnav-img{width:80px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--raised)}
.pnav-img img{display:block;width:100%;height:100%;object-fit:cover}
@media (max-width:600px){.pager{grid-template-columns:1fr}.pnav.next{grid-column:auto}.pnav-img{width:64px}}
/* icons in content */
.s-ic,.t-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--raised);color:var(--fg)}
.s-ic .icon,.t-ic .icon{width:18px;height:18px}
.strength{grid-template-columns:36px minmax(0,1fr);column-gap:16px}
.strength .s-ic{grid-row:span 3}
.strength > :not(.s-ic){grid-column:2}
.tool-name{display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px;align-items:start}
.sk p{display:inline-flex;align-items:center;gap:8px}
.sk p .icon{width:16px;height:16px;color:var(--fg-2)}
.crow .k{display:inline-flex;align-items:center;gap:8px}
.crow .k .icon{width:15px;height:15px}
/* method route motion */
.route-line::before{transform-origin:left center;animation:lineIn 1.1s var(--ease) .15s both}
:root[dir="rtl"] .route-line::before{transform-origin:right center}
.route .node{animation:pop .45s var(--ease) both;animation-delay:calc(var(--i) * 110ms + .3s)}
/* about: business design lead */
.about-lead{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px 64px;align-items:center;margin-block-end:64px}
.about-lead .about-intro{margin-block-end:0}
.lead-text{display:grid;gap:24px;min-width:0}
.bd-def{max-width:60ch;color:var(--fg-2)}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px;padding-block-start:24px;border-top:1px solid var(--line)}
.pillars .lbl{grid-column:1/-1;margin:0}
.pillar{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 12px;align-content:start}
.pillar .s-ic{grid-row:span 2}
.pillar h4{font-size:.9375rem;font-weight:500;line-height:1.4}
.pillar p{font-size:.875rem;line-height:1.5;color:var(--fg-2)}
.bd{margin:0;width:100%;max-width:440px;justify-self:center}
.bd svg{display:block;width:100%;height:auto}
.bd .set{fill:var(--fg);fill-opacity:.05;stroke:var(--fg-2);stroke-width:1.25;stroke-dasharray:580;animation:draw 1.5s var(--ease) both,fillIn 1s ease both;animation-delay:var(--d),calc(var(--d) + .5s)}
.bd .orbit{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 6}
.bd .ring{transform-origin:200px 205px;animation:spin 120s linear infinite}
.bd .sat{fill:var(--bg);stroke:var(--fg-3);stroke-width:1.25}
.bd .sat.acc{fill:var(--accent);stroke:var(--accent)}
.bd .pulse{fill:none;stroke:var(--accent);stroke-width:1.25;transform-origin:200px 205px;animation:breathe 3.6s ease-in-out infinite}
.bd .lab{font-family:var(--sans);font-size:14px;font-weight:500;fill:var(--fg);text-anchor:middle}
.bd .sub{font-family:var(--sans);font-size:12px;fill:var(--fg-3);text-anchor:middle}
.bd .core rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.25}
.bd .core text{font-family:var(--sans);font-size:12.5px;font-weight:500;fill:var(--fg);text-anchor:middle}
.bd .lab,.bd .sub,.bd .core{animation:viewIn .6s var(--ease) both;animation-delay:.9s}
@media (max-width:860px){.about-lead{grid-template-columns:1fr}.bd{max-width:360px}.pillars{grid-template-columns:1fr}}

function pager(view) {

const EN_N = { cases: ["case study", "case studies"], more: ["more engagement", "more engagements"], strengths: ["strength", "strengths"], certs: ["certificate", "certificates"],
  steps: ["milestone", "milestones"], phases: ["phase", "phases"], systems: ["system", "systems"], projects: ["engagement", "engagements"], areas: ["area", "areas"],
  products: ["product", "products"], tools: ["tool", "tools"], skillsets: ["skill set", "skill sets"], parts: ["part", "parts"] };
function cnt(n, k) {
  if (S.lang === "ar") { const f = AR_N[k]; return n === 1 ? f[0] : n === 2 ? f[1] : n <= 10 ? `${n} ${f[2]}` : `${n} ${f[3]}`; }
  return `${n} ${EN_N[k][n === 1 ? 0 : 1]}`;
}
function tileMeta(id) {
  const phases = C.systems.reduce((a, x) => a + x.ph.length, 0);

    work: [cnt(casesOrdered().length, "cases"), cnt(C.more.length, "more")], range: [cnt(C.rows.length, "projects"), cnt(C.cols.length, "areas")],

/* Strategy x Design x Technology: corners match the business design lenses (viability, desirability, feasibility). */
function triVisual() {
  const a = C.about.tri, W = 440, rtl = S.lang === "ar";
  const P = [[220, 74], [62, 318], [378, 318]].map(([x, y]) => [rtl ? W - x : x, y]);
  const cx = 220, cy = 252;
  const E = [[0, 1], [1, 2], [2, 0]];
  const w = v => Math.round(Math.max(92, T(v).length * (rtl ? 6.6 : 6.7) + 28));
  const g = 237, inner = P.map(([x, y]) => `${(cx + (x - cx) * .48).toFixed(1)},${(g + (y - g) * .48).toFixed(1)}`);
  const lab = [[P[0][0], 30, 47], [P[1][0], 356, 373], [P[2][0], 356, 373]];
  let reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  const cw = w(a.center) + 16;
  return `<figure class="tri" role="img" aria-label="${t(a.aria)}"><svg viewBox="0 0 ${W} 392" aria-hidden="true">
    <path class="tri-inner" d="M${inner.join(" L")} Z"/>
    ${E.map(([i, j], k) => `<line class="edge" x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[j][0]}" y2="${P[j][1]}" style="--d:${(k * .3).toFixed(1)}s"/>`).join("")}
    ${reduce ? "" : `<circle class="runner" r="4.5"><animateMotion dur="16s" repeatCount="indefinite" path="M${P[0]} L${P[1]} L${P[2]} Z"/></circle>`}
    ${P.map((p, i) => `<g class="node" style="--i:${i}"><circle class="halo" cx="${p[0]}" cy="${p[1]}" r="15"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="5"/></g>`).join("")}
    ${a.corners.map((c, i) => `<text class="lab" x="${lab[i][0]}" y="${lab[i][1]}">${t(c.t)}</text><text class="sub" x="${lab[i][0]}" y="${lab[i][2]}">${t(c.s)}</text>`).join("")}
    ${E.map(([i, j], k) => { const mx = (P[i][0] + P[j][0]) / 2, my = (P[i][1] + P[j][1]) / 2, pw = w(a.edges[k]);
      return `<g class="pill" style="--i:${k}"><rect x="${(mx - pw / 2).toFixed(1)}" y="${my - 13}" width="${pw}" height="26" rx="13"/><text x="${mx}" y="${my + 4}">${t(a.edges[k])}</text></g>`; }).join("")}
    <circle class="pulse" cx="${cx}" cy="${cy}" r="30"/>
    <g class="core"><rect x="${cx - cw / 2}" y="${cy - 15}" width="${cw}" height="30" rx="15"/><text x="${cx}" y="${cy + 4.5}">${t(a.center)}</text></g>
  </svg></figure>`;
}

/* An eight-point star: the north star of the UX part. */
function uxStar() {
  const c = 60, pts = [];
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, r = k % 4 === 0 ? 54 : k % 2 === 0 ? 24 : 11; pts.push(`${(c + r * Math.sin(a)).toFixed(1)},${(c - r * Math.cos(a)).toFixed(1)}`); }
  return `<svg class="star" viewBox="0 0 120 120" aria-hidden="true"><circle class="star-ring" cx="60" cy="60" r="44"/><polygon class="star-body" points="${pts.join(" ")}"/><circle class="star-core" cx="60" cy="60" r="3.5"/></svg>`;
}

      </div>
    </div>
    ${block(a.cornersHead, a.cornersSub, corners, "wide")}
    ${block(a.countHead, a.countSub, rows(a.count))}
    ${block(a.workHead, a.workSub, `<div class="panel">${rows(a.work)}</div>`)}
    ${block(a.certHead, a.certSub, certs)}
  </div></section>`;
}

function path() {
  return `<section class="section" id="path" data-sec><div class="wrap">
    ${secHead(C.pathHead, C.pathSub)}
    <div class="timeline">${C.path.map(p => `<div class="tl">
      <div class="yr num">${esc(S.lang === "ar" && p.yrAr ? p.yrAr : p.yr)}</div>
      <div><h3>${t(p.t)}</h3><p class="org">${t(p.org)}</p>${p.d ? `<p class="d">${t(p.d)}</p>` : ""}</div></div>`).join("")}</div>
  </div></section>`;
}

function contact() {
  return `<section class="contact scene" id="contact" data-sec><div class="wrap">
    <div class="contact-grid">
      <div><h2><span>${t(C.contactHead)}</span>${altTitle(C.contactHead)}</h2><p class="lead">${t(C.contactLead)}</p></div>
      <div class="crows">${C.contact.map((c, i) => `<div class="crow">
        <span class="k">${ic(CT_IC[i])}${t(c.k)}</span>
        <span class="v${c.href ? " link" : c.copy ? "" : " plain"}" id="cv-${i}">${c.href ? `<a href="${esc(c.href)}" target="_blank" rel="noopener">${c.dl ? ICON.download : ""}${t(c.v)}${c.dl ? "" : ICON.ext}</a>` : t(c.v)}</span>
        ${c.copy ? `<button class="copy-btn" type="button" data-copy="${esc(c.href || c.v)}" data-target="cv-${i}">${ICON.copy}<span>${t(C.copyT)}</span></button>` : ""}
      </div>`).join("")}</div>
    </div>
    <footer class="foot"><span>${t(C.foot)}</span><span>${t(C.foot2)}</span></footer>
  </div></section>`;
}

/* ---------- App: one page per section, routed on the hash ---------- */
const VIEWS = ["home", "about", "path", "method", "work", "range", "products", "contact"];
const curNav = () => S.view === "case" ? "work" : S.view;
function hashFor(view, item) {
  const base = view === "case" ? "work-" + item : view;
  if (S.lang === "ar") return view === "home" ? "ar" : "ar-" + base;
  return base;
}
function resolveId(h) {
  if (!h || h === "top" || h === "home") return { view: "home" };
  const cid = /^(work|case)-(.+)$/.exec(h);
  if (cid && C.cases.some(c => c.id === cid[2])) return { view: "case", item: cid[2] };
  if (h === "ubmp" || h === "metanoia" || h === "tools") return { view: "products", anchor: h };
  if (h === "lens" || h === "process" || h === "brand-strategy" || h === "ux") return { view: "method", anchor: h };
  return { view: VIEWS.includes(h) ? h : "home" };
}
function parseHash() {
  let h = (location.hash || "").slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  h = h.toLowerCase();
  if (h === "ar" || h === "en") return { lang: h, view: "home" };
  const m = /^(ar|en)-(.+)$/.exec(h);
  return Object.assign({ lang: m ? m[1] : null }, resolveId(m ? m[2] : h));
}

function viewHTML() {
  switch (S.view) {
    case "about": return about() + pager("about");
    case "path": return path() + pager("path");
    case "method": return method() + pager("method");
    case "work": return work() + pager("work");
    case "case": return caseView(S.item);
    case "range": return range() + pager("range");
    case "products": return products() + pager("products");
    case "contact": return "";
    default: return hero() + explore();
  }
}

function render() {
  const root = document.documentElement;
  root.lang = S.lang; root.dir = S.lang === "ar" ? "rtl" : "ltr"; root.dataset.view = S.view;
  S.menu = false;
  document.getElementById("app").innerHTML = header() + `<main id="main" class="view">${viewHTML()}</main>` + contact();
  updateChrome();
}

function headH() { const h = document.querySelector(".site-head"); return h ? h.offsetHeight : 64; }

function updateChrome() {
  const y = headH() + 1;
  let scene = false;
  document.querySelectorAll("section.scene").forEach(s => { const r = s.getBoundingClientRect(); if (r.top <= y && r.bottom > y) scene = true; });
  document.documentElement.classList.toggle("at-scene", scene);
}

let raf = 0;
window.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateChrome(); }); }, { passive: true });

function jump(id, smooth) {
  const el = document.getElementById(id); if (!el) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const top = el.getBoundingClientRect().top + window.scrollY - headH() + 1;
  window.scrollTo({ top, behavior: smooth && !reduce ? "smooth" : "auto" });
}

let firstRoute = true;
function route() {
  const r = parseHash();
  if (r.lang && r.lang !== S.lang) { S.lang = r.lang; try { localStorage.setItem("pf-lang", r.lang); } catch (e) {} }
  const moved = r.view !== S.view || (r.item || null) !== S.item;
  S.view = r.view; S.item = r.item || null;
  if (S.view === "case") S.open.add(S.item);
  const keep = S.keepY; S.keepY = null;
  render();
  const anchor = S.anchor || r.anchor; S.anchor = null;
  if (keep != null) window.scrollTo(0, keep);
  else if (anchor) requestAnimationFrame(() => jump(anchor, false));
  else if (moved) window.scrollTo(0, 0);
  if (!firstRoute && moved && keep == null) {
    const hd = document.querySelector("main h1, main h2, main .case-head h3");
    if (hd) { hd.setAttribute("tabindex", "-1"); hd.focus({ preventScroll: true }); }
  }
  firstRoute = false;
  updateChrome();
}

function go(id) {
  const r = resolveId(String(id).toLowerCase());
  if (r.anchor && r.view === S.view && document.getElementById(r.anchor)) { jump(r.anchor, true); return; }
  S.anchor = r.anchor || null;
  const h = hashFor(r.view, r.item);
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}

function setMenu(open) {
  const p = document.getElementById("menu-panel"), b = document.getElementById("menu-toggle");
  if (!p || !b) return;
  S.menu = open; p.hidden = !open; b.setAttribute("aria-expanded", String(open));
  b.querySelector("svg").outerHTML = open ? ICON.close : ICON.menu;
}

function setLang(l) {
  if ((l !== "en" && l !== "ar") || l === S.lang) return;
  S.lang = l;
  try { localStorage.setItem("pf-lang", l); } catch (e) {}
  S.keepY = window.scrollY;
  const h = hashFor(S.view, S.item);
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}

const galMedia = id => id === "ubmp" ? C.feature.media : (C.cases.find(x => x.id === id) || {}).media;

function setGallery(id, i) {
  const media = galMedia(id); if (!media || !media[i]) return;
  S.gal[id] = i;
  const m = media[i], g = document.querySelector(`.gallery[data-case="${id}"]`); if (!g) return;
  const fr = g.querySelector(".frame"), img = fr.querySelector("img");
  g.querySelectorAll(".thumb").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  g.querySelector(".cap").textContent = T(m.cap);
  img.style.opacity = "0";
  const pre = new Image();
  pre.onload = pre.onerror = () => {
    fr.classList.toggle("contain", m.fit === "contain");
    fr.style.background = m.bg || "";
    img.src = IMG + m.src; img.width = m.w; img.height = m.h; img.alt = T(m.cap);
    img.style.objectPosition = m.pos || "50% 50%";
    requestAnimationFrame(() => { img.style.opacity = "1"; });
  };
  pre.src = IMG + m.src;
}

document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); setMenu(false); go(j.dataset.jump); return; }
  if (e.target.closest("#menu-toggle")) { setMenu(!S.menu); return; }
  if (e.target.closest("#lang-toggle")) {
    setLang(S.lang === "ar" ? "en" : "ar");
    return;
  }
  const th = e.target.closest("[data-thumb]");
  if (th) { const [id, i] = th.dataset.thumb.split(":"); setGallery(id, +i); return; }
  const mb = e.target.closest("[data-more]");
  if (mb) {
    const id = mb.dataset.more, open = !S.open.has(id);
    open ? S.open.add(id) : S.open.delete(id);
    const p = document.getElementById("detail-" + id);
    if (p) p.hidden = !open;
    mb.setAttribute("aria-expanded", String(open));
    mb.querySelector("span").textContent = T(open ? C.lbl.close : C.lbl.open);
    return;
  }
  const b = e.target.closest("[data-copy]");
  if (b) {
    const val = b.dataset.copy, label = b.querySelector("span"), orig = T(C.copyT);
    const done = txt => { label.textContent = txt; setTimeout(() => { label.textContent = orig; }, 1600); };
    const selectIt = () => {
      const el = document.getElementById(b.dataset.target);
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      done(T(C.selectT));
    };
    try { navigator.clipboard.writeText(val).then(() => done(T(C.copiedT)), selectIt); } catch (err) { selectIt(); }
  }
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && S.menu) { setMenu(false); document.getElementById("menu-toggle")?.focus(); } });

window.addEventListener("hashchange", route);

let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  if (S.menu && window.innerWidth > 960) setMenu(false);
  updateChrome();
});

(function init() {
  const r = parseHash();
  let l = r.lang;
  if (!l) { try { l = localStorage.getItem("pf-lang"); } catch (e) {} }
  if (l !== "ar" && l !== "en") l = (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
  S.lang = l; S.view = null;
  document.documentElement.classList.add("boot");
  route();
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("boot")));
})();
</script>
</body>
</html>
